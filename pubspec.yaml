name: flutter_gherkin
description: A Gherkin / Cucumber parser and test runner for Dart and Flutter
version: 3.0.0-rc.17
homepage: https://github.com/jonsamwell/flutter_gherkin

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=2.2.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  analyzer: ^7.6.0
  collection: ^1.15.0
  gherkin:
    git:
      url: "https://github.com/Guix98/dart_gherkin"
      ref: "master"
  source_gen: ^3.0.0
  build: ^3.0.0
  glob: ^2.0.2

dev_dependencies:
  meta: ">=1.7.0 < 2.0.0"
  pedantic: ^1.11.1
  build_config: ^1.0.0
  flutter_lints: ^2.0.1

flutter:
